name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: flutter pub get

      - name: Build IPA (Unsigned)
        run: flutter build ipa --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          # Find the .app bundle and copy it to Payload
          find build/ios/archive/Runner.xcarchive/Products/Applications -name "*.app" -exec cp -r {} Payload/ \;
          # Zip it into an .ipa file
          zip -r CharlesAutos.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: CharlesAutos.ipa
